<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
<title id="title">London in minutes</title>
<desc id="desc">Original animated illustration. Motion is disabled when reduced motion is preferred.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171426"/><stop offset="1" stop-color="#0e1423"/></linearGradient>
  <linearGradient id="rainbow"><stop stop-color="#71efd2"/><stop offset=".5" stop-color="#b496ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7150ba" stop-opacity=".27"/><stop offset="1" stop-color="#7150ba" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6s ease-in-out -2s infinite}
.orbit{animation:orbit 20s linear infinite;transform-box:fill-box;transform-origin:center}
.spark{animation:spark 3s ease-in-out infinite}
.dash{animation:dash 9s linear infinite}
.blink{animation:blink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cursor{animation:cursor 1.5s step-end infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-100}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.15)}}
@keyframes cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="238" height="298" rx="20" fill="url(#bg)" stroke="#353047"/><path d="M22 1 H218" stroke="#ffcd77" stroke-width="2"/><text x="18" y="28" fill="#ffcd77" font-size="12" font-weight="600" class="mono" letter-spacing="1">04 / MAPS</text><g transform="translate(-127 24) scale(.65)"><g transform="translate(383 69)"><path d="M-45 4 C-53 -45, -15.0 -45, 7 -45 C45 -41, 60 1, 45 20 C30 49, -45 45, -45 4Z" fill="#ff7fc8" fill-opacity=".09" stroke="#ff7fc8" stroke-opacity=".65"/><path d="M-32 4 C-40 -32, -10.666666666666666 -32, 7 -32 C32 -28, 47 1, 32 20 C17 36, -32 32, -32 4Z" fill="#ffcd77" fill-opacity=".09" stroke="#ffcd77" stroke-opacity=".65"/><path d="M-19 4 C-27 -19, -6.333333333333333 -19, 7 -19 C19 -15, 34 1, 19 20 C4 23, -19 19, -19 4Z" fill="#71efd2" fill-opacity=".09" stroke="#71efd2" stroke-opacity=".65"/><path class="dash" d="M-53 3 Q-23 -12 -9 6 T22 11 T54 15" fill="none" stroke="#86c8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/><circle class="spark" cx="-5" cy="-7" r="10" fill="#71efd2" fill-opacity=".25"/><circle cx="-5" cy="-7" r="4" fill="#71efd2"/></g></g><text x="18" y="150" fill="#f5f1ff" font-size="27" font-weight="650" >London</text><text x="18" y="181" fill="#f5f1ff" font-size="27" font-weight="650" >in minutes</text><text x="18" y="216" fill="#b6aecb" font-size="19" font-weight="400" >Travel-time</text><text x="18" y="241" fill="#b6aecb" font-size="19" font-weight="400" >visualisation.</text><text x="18" y="278" fill="#ffcd77" font-size="12" font-weight="600" class="mono" letter-spacing="1">OPEN MAP</text><path d="M203 279 L216 266 M204 266 H216 V278" fill="none" stroke="#ffcd77" stroke-width="2"/>
</svg>
