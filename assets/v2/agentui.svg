<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="title desc">
<title id="title">AgentUI</title>
<desc id="desc">Original animated illustration. Motion is disabled when reduced motion is preferred.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171426"/><stop offset="1" stop-color="#0e1423"/></linearGradient>
  <linearGradient id="rainbow"><stop stop-color="#71efd2"/><stop offset=".5" stop-color="#b496ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7150ba" stop-opacity=".27"/><stop offset="1" stop-color="#7150ba" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6s ease-in-out -2s infinite}
.orbit{animation:orbit 20s linear infinite;transform-box:fill-box;transform-origin:center}
.spark{animation:spark 3s ease-in-out infinite}
.dash{animation:dash 9s linear infinite}
.blink{animation:blink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cursor{animation:cursor 1.5s step-end infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-100}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.15)}}
@keyframes cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="478" height="248" rx="20" fill="url(#bg)" stroke="#353047"/><path d="M22 1 H458" stroke="#ffa88a" stroke-width="2"/><text x="26" y="37" fill="#ffa88a" font-size="12" font-weight="600" class="mono" letter-spacing="1.5">06 / DEVELOPER TOOLS</text><g transform="translate(382 72)"><g class="float2">
<rect x="-52" y="-36" width="104" height="72" rx="11" fill="#2c2530" stroke="#ffa88a" stroke-width="1.8"/>
<path d="M-52 -18 H52" stroke="#ffa88a" stroke-opacity=".4"/>
<circle cx="-40" cy="-27" r="2" fill="#ffa88a"/><circle cx="-32" cy="-27" r="2" fill="#b496ff"/>
<path d="M-35 -1 H35 M-35 17 H35" stroke="#ffa88a" stroke-width="2" stroke-opacity=".45" stroke-linecap="round"/>
<circle cx="-9" cy="-1" r="5" fill="#ffa88a"/>
<circle cx="19" cy="17" r="5" fill="#b496ff"/>
<path d="M32 3 L44 9 L37 12 L34 19Z" fill="#71efd2" stroke="#2c2530" stroke-width="1.5"/>
</g></g><text x="26" y="143" fill="#f5f1ff" font-size="30" font-weight="650" >AgentUI</text><text x="27" y="178" fill="#b6aecb" font-size="16" font-weight="400" >Interactive controls for coding agents.</text><text x="27" y="201" fill="#b6aecb" font-size="16" font-weight="400" >An MCP server for forms and live previews.</text><text x="27" y="232" fill="#ffa88a" font-size="11" font-weight="600" class="mono" letter-spacing="1.2">VIEW PROJECT</text><path d="M433 229 L447 215 M433 215 H447 V229" fill="none" stroke="#ffa88a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
