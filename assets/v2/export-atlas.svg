<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="title desc">
<title id="title">Export Atlas</title>
<desc id="desc">Original animated illustration. Motion is disabled when reduced motion is preferred.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171426"/><stop offset="1" stop-color="#0e1423"/></linearGradient>
  <linearGradient id="rainbow"><stop stop-color="#71efd2"/><stop offset=".5" stop-color="#b496ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7150ba" stop-opacity=".27"/><stop offset="1" stop-color="#7150ba" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6s ease-in-out -2s infinite}
.orbit{animation:orbit 20s linear infinite;transform-box:fill-box;transform-origin:center}
.spark{animation:spark 3s ease-in-out infinite}
.dash{animation:dash 9s linear infinite}
.blink{animation:blink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cursor{animation:cursor 1.5s step-end infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-100}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.15)}}
@keyframes cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="478" height="248" rx="20" fill="url(#bg)" stroke="#353047"/><path d="M22 1 H458" stroke="#88c8ff" stroke-width="2"/><text x="26" y="37" fill="#88c8ff" font-size="12" font-weight="600" class="mono" letter-spacing="1.5">05 / GLOBAL TRADE</text><g transform="translate(382 70)">
<circle r="41" fill="#88c8ff" fill-opacity=".06" stroke="#88c8ff" stroke-width="1.8"/>
<ellipse rx="19" ry="41" fill="none" stroke="#88c8ff" stroke-opacity=".6"/>
<ellipse rx="41" ry="15" fill="none" stroke="#88c8ff" stroke-opacity=".6"/>
<path d="M-37 -18 H37 M-37 18 H37 M0 -41 V41" fill="none" stroke="#88c8ff" stroke-opacity=".3"/>
<path class="dash" d="M-45 18 Q-15 -54 45 -8" fill="none" stroke="#71efd2" stroke-width="2.5" stroke-dasharray="4 5"/>
<circle cx="-36" cy="2" r="4" fill="#71efd2"/>
<circle cx="32" cy="-17" r="4" fill="#ffcd77"/>
</g><text x="26" y="143" fill="#f5f1ff" font-size="30" font-weight="650" >Export Atlas</text><text x="27" y="178" fill="#b6aecb" font-size="16" font-weight="400" >Global exports across goods and services.</text><text x="27" y="201" fill="#b6aecb" font-size="16" font-weight="400" >Compare countries, markets, and years.</text><text x="27" y="232" fill="#88c8ff" font-size="11" font-weight="600" class="mono" letter-spacing="1.2">OPEN LIVE MAP</text><path d="M433 229 L447 215 M433 215 H447 V229" fill="none" stroke="#88c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
