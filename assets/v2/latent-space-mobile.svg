<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
<title id="title">Latent Space Explorer</title>
<desc id="desc">Original animated illustration. Motion is disabled when reduced motion is preferred.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171426"/><stop offset="1" stop-color="#0e1423"/></linearGradient>
  <linearGradient id="rainbow"><stop stop-color="#71efd2"/><stop offset=".5" stop-color="#b496ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7150ba" stop-opacity=".27"/><stop offset="1" stop-color="#7150ba" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6s ease-in-out -2s infinite}
.orbit{animation:orbit 20s linear infinite;transform-box:fill-box;transform-origin:center}
.spark{animation:spark 3s ease-in-out infinite}
.dash{animation:dash 9s linear infinite}
.blink{animation:blink 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cursor{animation:cursor 1.5s step-end infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-100}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.15)}}
@keyframes cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="238" height="298" rx="20" fill="url(#bg)" stroke="#353047"/><path d="M22 1 H218" stroke="#ff7fc8" stroke-width="2"/><text x="18" y="28" fill="#ff7fc8" font-size="12" font-weight="600" class="mono" letter-spacing="1">02 / MODELS</text><g transform="translate(-127 24) scale(.65)"><g transform="translate(384 72)"><g class="orbit"><ellipse rx="48" ry="18" transform="rotate(0)" fill="none" stroke="#ff7fc8" stroke-width="2"/><ellipse rx="48" ry="18" transform="rotate(60)" fill="none" stroke="#b496ff" stroke-width="2"/><ellipse rx="48" ry="18" transform="rotate(120)" fill="none" stroke="#71efd2" stroke-width="2"/><circle cx="48" r="5" fill="#ff7fc8"/></g><circle r="9" fill="#ffcd77"/><circle r="4" fill="#fff0d2"/></g></g><text x="18" y="150" fill="#f5f1ff" font-size="27" font-weight="650" >Latent Space</text><text x="18" y="181" fill="#f5f1ff" font-size="27" font-weight="650" >Explorer</text><text x="18" y="216" fill="#b6aecb" font-size="19" font-weight="400" >Interactive</text><text x="18" y="241" fill="#b6aecb" font-size="19" font-weight="400" >generative images.</text><text x="18" y="278" fill="#ff7fc8" font-size="12" font-weight="600" class="mono" letter-spacing="1">VIEW PROJECT</text><path d="M203 279 L216 266 M204 266 H216 V278" fill="none" stroke="#ff7fc8" stroke-width="2"/>
</svg>
