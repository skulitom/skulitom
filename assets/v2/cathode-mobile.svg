<path class="cursor" d="M-16 2 H-4" stroke="#71efd2" stroke-width="2"/>
<circle cx="45" cy="15" r="3" fill="#ffcd77"/>
<path d="M-40 -22 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 -17 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 -12 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 -7 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 -2 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 3 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 8 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 13 H32" stroke="#71efd2" opacity=".08"/><path d="M-40 18 H32" stroke="#71efd2" opacity=".08"/></g></g><g transform="translate(318 57) scale(0.7)"><path class="spark" style="animation-delay:-1s" d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7" fill="#ff7fc8"/></g></g><text x="18" y="150" fill="#f5f1ff" font-size="27" font-weight="650" >Cathode</text><text x="18" y="216" fill="#b6aecb" font-size="19" font-weight="400" >A CRT monitor</text><text x="18" y="241" fill="#b6aecb" font-size="19" font-weight="400" >for Windows apps.</text><text x="18" y="278" fill="#71efd2" font-size="12" font-weight="600" class="mono" letter-spacing="1">VIEW PROJECT</text><path d="M203 279 L216 266 M204 266 H216 V278" fill="none" stroke="#71efd2" stroke-width="2"/>
