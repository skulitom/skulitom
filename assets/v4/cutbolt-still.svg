<svg xmlns="http://www.w3.org/2000/svg" width="384" height="200" viewBox="0 0 192 100" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">Darkroom flipbook</title><desc id="d">Pixel art made with Pixelbolt: a strip of film is pulled up out of a pink developing bath, round a brass sprocket drum and through a playhead gate, playing a bouncing-ball flipbook while drops fall off it back into the tray.</desc>
<style>image{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}.a{animation-timing-function:step-end;animation-iteration-count:infinite}text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.ov{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style>
<defs><clipPath id="r"><rect width="192" height="100" rx="8"/></clipPath></defs>
<g clip-path="url(#r)"><image x="0" y="0" width="192" height="100" href="data:image/png;base64," image-rendering="optimizeSpeed"/><g class="ov"><text x="8" y="11.5" fill="#ff7fc8" font-size="4.8" font-weight="600" class="mono" letter-spacing="0.55" text-anchor="start">VIDEO FOR AGENTS</text></g></g><rect x="0.25" y="0.25" width="191.5" height="99.5" rx="8" fill="none" stroke="#353047" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
</svg>
