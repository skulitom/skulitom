<svg xmlns="http://www.w3.org/2000/svg" width="384" height="200" viewBox="0 0 192 100" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">Anode</title><desc id="d">Pixel art made with Pixelbolt: your desk and monitor in front, a calm editor on the screen; through an arched doorway, a second desk in drifting pale mist, where an agent&#x27;s mint cursor works on its own and the mist parts and curls in its wake.</desc>
