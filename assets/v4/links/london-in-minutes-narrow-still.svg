<svg xmlns="http://www.w3.org/2000/svg" width="112" height="84" viewBox="0 0 56 42" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">London in minutes</title><desc id="d">Pixel art made with Pixelbolt: a little violet steam train on a track along a ledge of the workbench, a faint London skyline behind; it runs, chuffing three puffs of simulated steam, and eases to a stop.</desc>
<style>image{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}.a{animation-timing-function:step-end;animation-iteration-count:infinite}text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.ov{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style>
<defs><clipPath id="r"><rect width="56" height="42" rx="6"/></clipPath></defs>
<g clip-path="url(#r)"><image x="0" y="0" width="56" height="42" href="data:image/png;base64," image-rendering="optimizeSpeed"/><g class="ov"><text x="28.0" y="31" fill="#f5f1ff" font-size="6.5" font-weight="600" text-anchor="middle">London</text><text x="28.0" y="38.5" fill="#f5f1ff" font-size="6.5" font-weight="600" text-anchor="middle">in minutes</text></g></g><rect x="0.25" y="0.25" width="55.5" height="41.5" rx="6" fill="none" stroke="#353047" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
