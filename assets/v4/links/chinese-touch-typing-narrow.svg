<svg xmlns="http://www.w3.org/2000/svg" width="112" height="84" viewBox="0 0 56 42" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">Chinese Touch Typing</title><desc id="d">Pixel art made with Pixelbolt: a three-key macropad with brass keycaps lettered N, I and 3, the pinyin input for 你; the keys are typed in turn and the third-tone mark drops onto the I with a glint.</desc>
<style>image{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}.a{animation-timing-function:step-end;animation-iteration-count:infinite}@keyframes k0{0.0000%{transform:translate(0px,0px)}0.2917%{transform:translate(-56px,0px)}0.5833%{transform:translate(-112px,0px)}0.8750%{transform:translate(-168px,0px)}1.1667%{transform:translate(-224px,0px)}1.4583%{transform:translate(-280px,0px)}1.7500%{transform:translate(-336px,0px)}2.0417%{transform:translate(-392px,0px)}2.3333%{transform:translate(0px,-42px)}2.6250%{transform:translate(-56px,-42px)}2.9167%{transform:translate(-112px,-42px)}3.2083%{transform:translate(-168px,-42px)}3.5000%{transform:translate(-224px,-42px)}3.7917%{transform:translate(-280px,-42px)}4.0833%{transform:translate(-336px,-42px)}4.3750%{transform:translate(-392px,-42px)}4.6667%{transform:translate(0px,-84px)}4.9583%{transform:translate(-56px,-84px)}5.2500%{transform:translate(-112px,-84px)}5.5417%{transform:translate(-168px,-84px)}5.8333%{transform:translate(-224px,-84px)}6.1250%{transform:translate(-280px,-84px)}}.l0{animation-name:k0;animation-duration:24000ms;animation-delay:12000ms;transform:translate(0px,0px)}@media (prefers-reduced-motion:reduce){.l0{animation:none;transform:translate(-280px,-84px)}}text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.ov{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}</style>
<defs><clipPath id="c0"><rect x="0" y="0" width="56" height="42"/></clipPath><clipPath id="r"><rect width="56" height="42" rx="6"/></clipPath></defs>
<g clip-path="url(#r)"><g clip-path="url(#c0)"><g transform="translate(0 0)"><image class="a l0" width="448" height="126" href="data:image/png;base64," image-rendering="optimizeSpeed"/></g></g><g class="ov"><text x="28.0" y="31" fill="#f5f1ff" font-size="6.5" font-weight="600" text-anchor="middle">Chinese</text><text x="28.0" y="38.5" fill="#f5f1ff" font-size="6.5" font-weight="600" text-anchor="middle">Touch Typing</text></g></g><rect x="0.25" y="0.25" width="55.5" height="41.5" rx="6" fill="none" stroke="#353047" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
