<title id="t">Chinese Radicals</title><desc id="d">Pixel art made with Pixelbolt: a calligraphy practice sheet with the radical 木 printed in pink for tracing; a brush inks its first stroke in simulated wet ink, which glistens and dries matt.</desc>
